name: lottery-model-lab

services:
  app:
    image: ${LOTTERY_IMAGE:-ghcr.io/coco422/lottery-model-lab:latest}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      LOTTERY_APP_MODE: public
      LOTTERY_RUNTIME_ROOT: /app/model_data
      LOTTERY_RESULTS_ROOT: /app/results
      LOTTERY_LUNAR_CALENDAR_PATH: /app/model_data/lunar_calendar.csv
      LOTTERY_ALLOWED_ORIGINS: ${LOTTERY_ALLOWED_ORIGINS:-}
      LOTTERY_PUBLIC_MAX_FUTURE_DAYS: ${LOTTERY_PUBLIC_MAX_FUTURE_DAYS:-366}
    ports:
      - "${LOTTERY_BIND_ADDRESS:-127.0.0.1}:${LOTTERY_PORT:-8765}:8765"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${LOTTERY_MEMORY_LIMIT:-1g}
    cpus: ${LOTTERY_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=3).read()"
      interval: 15s
      timeout: 4s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
